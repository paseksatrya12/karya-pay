# KaryaPay — tempel isi file ini di aaPanel: Website → (situs) → Conf → "URL rewrite".
# Root situs (Site directory) diarahkan ke /www/wwwroot/karyapay/current.
#
# Catatan prioritas Nginx: konfigurasi bawaan aaPanel punya blok regex untuk .js/.css/.png
# (expires 12h / 30d). `^~` dan `=` di bawah sengaja dipakai agar aturan ini yang menang.

# ── FASE 1: Frontend (SPA React) ───────────────────────────────────────────

# File build Vite punya hash di namanya → aman di-cache 1 tahun.
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

# index.html tidak boleh di-cache agar pengguna langsung mendapat versi baru setelah deploy.
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-Frame-Options "SAMEORIGIN";
}

# Semua route aplikasi (/invoice/INV-2026-001/pdf, /klien, …) dilayani index.html.
location / {
    try_files $uri $uri/ /index.html;
}

# File rilis internal jangan sampai bisa diunduh.
location = /REVISION {
    deny all;
}

